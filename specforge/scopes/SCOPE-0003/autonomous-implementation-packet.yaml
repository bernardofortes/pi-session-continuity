mini_anchor:
  original_intent: Harden manual checkpoint handoff behavior after core artifact engine
    hardening.
  success_minimum:
  - validation failure after synthesis queues no prompt
  - busy/idle delivery mode covered
  - archive status/path and lock cleanup covered
  - local gates pass
  non_goals:
  - status/settings
  - automatic threshold
  - compaction changes
  - external mutation
  - product spec changes
  invariants:
  - Durable Continuity Brief first
  - resume prompt from disk artifact
  - failed artifacts are never resume input
  - no campaign terminology in product runtime strings
  allowed_scope:
  - src/handoff.ts if needed
  - test/handoff.test.ts
  - docs/deploys
  - SpecForge run evidence
  drift_risks:
  - expanding into threshold/status episodes
  - claiming live Pi smoke without running it
  stop_conditions:
  - contract ambiguity
  - reviewer blocker/major
  - validation cannot pass locally
mini_slice:
  id: slice-001
  smallest_e2e_proof: Focused handoff tests prove manual checkpoint failure/success
    semantics and full local gates pass.
  observable_behavior:
  - invalid synthesized brief queues no prompt and writes failed artifact
  - idle handoff sends immediately without followUp option; busy handoff uses followUp
  - successful archive leaves final archive artifact and cleans active/per-event locks
  allowed_files_or_areas: *id001
  forbidden_files_or_areas:
  - docs/product-spec.md
  - AGENTS.md
  - .git/
  required_evidence:
  - kind: command
    command: npm test
    path: null
    check: tests pass
    required: true
    proves: new handoff tests pass
  - kind: command
    command: npm run typecheck
    path: null
    check: typecheck passes
    required: true
    proves: types remain valid
  - kind: command
    command: npm pack --dry-run
    path: null
    check: pack dry-run passes
    required: true
    proves: package still packs
  - kind: artifact
    command: null
    path: specforge/runs/RUN-0003/subagents/JUDGE-0001.md
    check: fresh reviewer pass
    required: true
    proves: independent review found no blockers/majors
  observable_outcome_hints:
    applies: false
    trigger_reason: null
    primary_scenario: unit-level handoff contract hardening
    artifact_kind: cli_output
    suggested_artifacts:
    - CMD logs
    - JUDGE-0001.md
    spec_refs:
    - docs/product-spec.md sections 3, 7, 8, 10, 12, 15, 18
    spec_conformance_checks:
    - no prompt on validation failure
    - resume prompt from saved disk artifact
    - archive after queue
    - followUp only when busy
    sanity_checks:
    - no external mutation
    - runtime source has no campaign terms
    reviewer_needed: true
  optional_evidence: []
  what_not_to_do:
  - do not edit product spec
  - do not add threshold/status features
  - do not install into Pi harness
  budget:
    max_files_changed: 8
    max_new_files: 6
    max_new_abstractions: 1
    max_runtime_minutes: 60
    max_review_rounds: 2
    max_docs_pages: 1
