mini_anchor:
  original_intent: Harden Pi Session Continuity artifact/config core after package
    skeleton.
  success_minimum:
  - non-pending artifacts rejected as resume input
  - status transitions enforced
  - frontmatter version/numeric fields validated
  - relative artifactDirectory cannot escape config directory
  - tests and validation pass
  non_goals:
  - external install
  - git push/tag/release
  - npm publish
  - active Pi harness install
  - product spec changes
  - new command surface
  invariants:
  - Durable Continuity Brief first
  - resume prompt from disk artifact
  - failed/archived artifacts are not resume input
  - relative artifactDirectory resolves under CONFIG_DIR_NAME unless absolute
  allowed_scope:
  - src/artifact.ts
  - src/config.ts
  - test/artifact.test.ts
  - test/config.test.ts
  - SpecForge/deploy/campaign evidence
  drift_risks:
  - overfitting directive detector beyond spec
  - changing command behavior outside this slice
  - claiming release readiness without external smoke
  stop_conditions:
  - product contract ambiguity requiring Bernardo decision
  - validation cannot pass locally
  - reviewer finds blocker/major
