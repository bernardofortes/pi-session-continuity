mini_anchor:
  original_intent: Bootstrap and begin implementing Pi Session Continuity package
    under the campaign-approved SpecForge Mini fallback route.
  success_minimum:
  - package skeleton exists
  - extension entrypoint exists
  - core contract helpers and tests exist
  - local validation gates attempted and recorded
  non_goals:
  - external install
  - git push/tag/release
  - npm publish
  - active Pi harness install
  - product scope change beyond docs/product-spec.md
  invariants:
  - Durable Continuity Brief first
  - resume prompt from disk artifact
  - compaction only after safe artifact/resume path
  - no campaign terminology in product runtime strings
  allowed_scope:
  - package skeleton
  - extension entrypoint
  - core source
  - tests
  - smoke script placeholders
  - README/CHANGELOG/LICENSE
  - SpecForge run evidence
  drift_risks:
  - accidentally encoding campaign concepts into product code
  - claiming release readiness without clean install smoke
  stop_conditions:
  - external mutation required
  - product contract ambiguity requiring Bernardo decision
  - validation gate cannot be made runnable locally
mini_slice:
  id: slice-001
  smallest_e2e_proof: A local Pi package skeleton with first core implementation can
    be typechecked, tested, and packed without external mutation.
  observable_behavior:
